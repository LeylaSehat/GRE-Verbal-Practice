{id:76,type:'Reading Comprehension',difficulty:2,
 q:`[Passage] Recent studies have challenged the "Mozart Effect"—the claim that listening to Mozart temporarily boosts spatial reasoning. The original 1993 study showed a modest, short-lived improvement. However, subsequent research found the effect unreliable: it appeared in some studies but not others, and meta-analyses suggested any benefits were marginal at best. Proponents now argue that the original claim was oversimplified and that the real benefit may be motivational—engaged listening improves focus broadly, regardless of composer.\n\nThe passage's primary purpose is to:`,
 choices:[{e:'To definitively disprove the Mozart Effect'},{e:'To trace the evolution of a scientific claim and its limitations'},{e:'To argue that classical music has no effect on cognition'},{e:'To recommend listening to Mozart for academic performance'},{e:'To compare Mozart with other composers on cognitive effects'}],
 answer:1,
 exp:`The passage describes the original claim (1993), subsequent challenge (meta-analyses), and a revised explanation (motivational). This is tracing how the scientific understanding evolved, not definitively disproving it (A) or recommending it (D).`,},

{id:77,type:'Reading Comprehension',difficulty:3,
 q:`[Passage] "Regulatory capture" occurs when a regulatory agency, created to act in the public interest, instead advances the commercial interests of the industry it is supposed to regulate. This phenomenon can arise through several mechanisms: the "revolving door" (movement of individuals between regulator and regulated), information asymmetry (the regulated industry often knows more than the regulator), and the diffuse nature of public benefits versus concentrated industry losses from strict regulation.\n\nAccording to the passage, which of the following best explains why regulatory capture is difficult to prevent?`,
 choices:[{e:'Regulators are often dishonest individuals'},{e:'Structural factors like information asymmetry and career incentives create systematic vulnerabilities'},{e:'Regulatory agencies lack sufficient funding'},{e:'Industries always lobby more effectively than public interest groups'},{e:'Regulatory capture is an inevitable consequence of democracy'}],
 answer:1,
 exp:`The passage identifies three structural mechanisms: revolving door (career incentives), information asymmetry, and diffuse vs. concentrated interests. Answer B captures these structural factors correctly. A (dishonesty) and C (funding) are not mentioned.`,},

{id:78,type:'Reading Comprehension',difficulty:2,
 q:`[Passage] The placebo effect—improvement in patient outcomes due to belief in treatment rather than the treatment itself—has long been dismissed as "mere" psychology. However, neuroimaging studies now show that placebo treatments trigger measurable neurochemical changes, including the release of endogenous opioids. This suggests the effect is not "imaginary" but involves genuine physiological mechanisms, raising important questions about the boundary between mind and body in medicine.\n\nThe author's attitude toward the placebo effect can best be described as:`,
 choices:[{e:'Skeptical — the author doubts its existence'},{e:'Enthusiastically endorsing — the author wants it used in all treatments'},{e:'Analytically respectful — the author takes it seriously as a genuine physiological phenomenon'},{e:'Dismissive — the author agrees it is "mere" psychology'},{e:'Alarmist — the author fears its ethical implications'}],
 answer:2,
 exp:`The author presents neuroimaging evidence that the placebo effect has real physiological basis and calls for examining the "boundary between mind and body." This is analytical respect — taking it seriously as a real phenomenon, not dismissing or over-endorsing it.`,},

{id:79,type:'Reading Comprehension',difficulty:3,
 q:`[Passage] Early industrialization in Britain proceeded without significant state intervention, creating what historians call "spontaneous order" in factory organization. Workers, entrepreneurs, and local communities improvised solutions to novel problems without central planning. Revisionists argue, however, that this narrative obscures substantial early legal and political scaffolding — enclosure acts, poor laws, and contract enforcement — that provided essential preconditions for this apparently spontaneous development.\n\nThe revisionist argument is primarily aimed at:`,
 choices:[{e:'Praising government intervention in economic affairs'},{e:'Challenging the claim that industrialization was truly spontaneous by revealing its hidden prerequisites'},{e:'Arguing that industrialization was a failure without state support'},{e:'Showing that workers had no agency in early industrialization'},{e:'Recommending current economic policy based on historical lessons'}],
 answer:1,
 exp:`Revisionists argue that the "spontaneous order" narrative obscures prior legal scaffolding (enclosure acts, poor laws, contract enforcement). They challenge the "spontaneous" label by showing it rested on hidden prerequisites — Answer B.`,},

{id:80,type:'Reading Comprehension',difficulty:2,
 q:`[Passage] Coral reefs cover less than 1% of the ocean floor but support approximately 25% of all marine species. Rising ocean temperatures bleach coral — the coral expels its symbiotic algae under heat stress, losing both color and its primary energy source. Repeated bleaching events weaken and eventually kill coral. Since 2016, the Great Barrier Reef has experienced four mass bleaching events. Scientists warn that without significant reductions in carbon emissions, most tropical reefs will be functionally extinct by 2050.\n\nWhich of the following can be directly inferred from the passage?`,
 choices:[{e:'Coral reefs will definitely be extinct by 2050'},{e:'The Great Barrier Reef has fully recovered from its bleaching events'},{e:'The loss of coral reefs would threaten a disproportionately large share of marine biodiversity'},{e:'Coral bleaching is caused by pollution rather than temperature'},{e:'All coral reefs will experience bleaching by 2025'}],
 answer:2,
 exp:`Less than 1% of ocean floor supports 25% of marine species. If reefs are lost, 25% of species are threatened — that is disproportionate. Answer A says "definitely" but the passage says scientists "warn" — a conditional. B and D contradict the passage.`,},

{id:81,type:'Reading Comprehension',difficulty:3,
 q:`[Passage] The concept of "nudge" theory, developed by Thaler and Sunstein, holds that small changes in how choices are presented (the "choice architecture") can predictably alter behavior without restricting options or changing economic incentives. For example, making healthy foods more visible in cafeterias increases their selection. Critics argue that nudges are paternalistic — they manipulate behavior without the subject's full awareness. Proponents counter that since all choice architectures are inevitable and designed by someone, deliberately designing them for beneficial outcomes is ethically superior to leaving them to chance or commercial interests.\n\nThe proponent's argument is best understood as:`,
 choices:[{e:'A rejection of the critics\' premise that nudges manipulate behavior'},{e:'An argument from the inevitability of choice architecture to the preferability of deliberate beneficial design'},{e:'A claim that nudges do not actually affect behavior'},{e:'A rejection of the ethical concerns raised by critics'},{e:'An endorsement of government control over consumer choices'}],
 answer:1,
 exp:`Proponents don't deny manipulation or ethical concerns. They argue: since choice architecture always exists (inevitability), it should be designed deliberately for good outcomes rather than accidentally or commercially. This is an "inevitability → better to design well" argument — Answer B.`,},

{id:82,type:'Reading Comprehension',difficulty:2,
 q:`[Passage] Unlike the Western philosophical tradition, which often treats the individual self as the primary unit of moral analysis, many Indigenous philosophical traditions hold that personhood is fundamentally relational — one becomes a person through one's relationships and responsibilities to family, community, land, and ancestors. From this perspective, ethical obligations are not derived from abstract principles but from the concrete web of relationships in which one is embedded.\n\nThe passage suggests that Indigenous philosophical traditions differ from Western ones primarily in their:`,
 choices:[{e:'Rejection of ethical obligations entirely'},{e:'View of what constitutes the fundamental unit of moral identity and the source of ethical obligation'},{e:'Belief that community matters more than ethics'},{e:'Emphasis on abstract principles over concrete experience'},{e:'Rejection of the importance of ancestral traditions'}],
 answer:1,
 exp:`The key difference: Western = individual as moral unit; Indigenous = relational personhood as moral unit. And Western uses abstract principles; Indigenous uses concrete relationships. Answer B captures both: the fundamental unit and the source of obligation.`,},

{id:83,type:'Reading Comprehension',difficulty:3,
 q:`[Passage] The "bandwidth" metaphor, used by Mullainathan and Shafir in Scarcity, argues that cognitive resources are like bandwidth — finite and taxable. Poverty imposes a cognitive tax: the mental effort required to manage scarce resources (timing bill payments, stretching food budgets) consumes bandwidth that would otherwise be available for long-term planning, impulse control, and sound decision-making. This helps explain patterns of behavior that critics attribute to poor character but may be structural consequences of scarcity itself.\n\nThe authors' use of the "bandwidth" metaphor serves primarily to:`,
 choices:[{e:'To argue that poor people have inherently less cognitive ability'},{e:'To provide a mechanistic explanation for behavioral patterns associated with poverty that is structural rather than dispositional'},{e:'To suggest that technology could solve poverty'},{e:'To endorse the view that poverty is the result of character flaws'},{e:'To argue for universal basic income'}],
 answer:1,
 exp:`The metaphor explains why poverty causes poor decisions (scarcity taxes bandwidth) without attributing this to inherent character flaws. It's structural (scarcity causes the problem) not dispositional (the person is the problem). Answer B captures this reframing.`,},

{id:84,type:'Reading Comprehension',difficulty:2,
 q:`[Passage] Urban heat islands — where cities are measurably warmer than surrounding rural areas — develop because buildings, pavement, and dark surfaces absorb and retain heat while vegetation is replaced. Studies show city centers can be 7°F warmer than nearby countryside. Mitigation strategies include green roofs, urban forests, and reflective "cool roofs." However, critics note that green infrastructure investments often flow to wealthy neighborhoods, potentially widening environmental inequality.\n\nWhich concern does the passage raise about the proposed solutions?`,
 choices:[{e:'They are technically impossible to implement'},{e:'They may exacerbate inequality by concentrating benefits in already-advantaged areas'},{e:'They will not reduce urban temperatures sufficiently'},{e:'They are too expensive for any city to afford'},{e:'They require federal rather than local funding'}],
 answer:1,
 exp:`The passage states: "green infrastructure investments often flow to wealthy neighborhoods, potentially widening environmental inequality." This is Answer B — benefits concentrated in already-advantaged areas. A, C, D, and E are not mentioned.`,},

{id:85,type:'Reading Comprehension',difficulty:3,
 q:`[Passage] The distinction between analytic and synthetic statements, central to logical positivism, was famously challenged by Quine in "Two Dogmas of Empiricism." Analytic statements are true by definition (bachelors are unmarried); synthetic statements are empirically verified (the cat is on the mat). Quine argued the line cannot be clearly drawn: even seemingly analytic statements rest on background assumptions that could in principle be revised in light of evidence. This "web of belief" view holds that no statement is immune to revision.\n\nQuine's argument implies which of the following?`,
 choices:[{e:'All statements are equally uncertain'},{e:'The boundary between necessary truth and empirical contingency is less sharp than logical positivists claimed'},{e:'Empirical evidence is irrelevant to philosophical claims'},{e:'Language is purely conventional with no necessary truths'},{e:'Logic should replace empirical investigation'}],
 answer:1,
 exp:`Quine says even analytic truths can in principle be revised with evidence. This blurs the sharp line logical positivists drew between analytic (necessarily true) and synthetic (empirically contingent). Answer B is the direct implication. A goes too far — Quine doesn't say all truths are equally uncertain.`,},

{id:86,type:'Reading Comprehension',difficulty:2,
 q:`[Passage] Psychologists distinguish between "intrinsic" motivation — doing something for its own sake, for the inherent pleasure or meaning — and "extrinsic" motivation — doing it for external rewards like money or grades. Research suggests that introducing extrinsic rewards for intrinsically motivated activities can "crowd out" intrinsic motivation, a phenomenon called the "overjustification effect." Children who are paid to read may come to see reading as work rather than pleasure.\n\nThe "overjustification effect" most closely resembles which of the following scenarios?`,
 choices:[{e:'A student studies more after receiving praise from a teacher'},{e:'A volunteer who begins receiving payment for their charity work gradually loses the satisfaction of giving freely'},{e:'An athlete trains harder after signing a lucrative contract'},{e:'A chef becomes more creative after receiving a prestigious award'},{e:'A musician practices more diligently after receiving a scholarship'}],
 answer:1,
 exp:`Overjustification = adding external reward to intrinsically motivated activity reduces intrinsic motivation. The volunteer was intrinsically motivated (free giving = satisfaction). Adding payment makes it feel like "work," crowding out the intrinsic satisfaction. Answer B matches perfectly.`,},

{id:87,type:'Reading Comprehension',difficulty:3,
 q:`[Passage] The history of cartography reveals how maps are never merely technical documents but always encode the political and ideological assumptions of their makers. The famous Mercator projection, developed in 1569, distorts the relative sizes of landmasses, making Europe and North America appear far larger than they are relative to equatorial regions. Critics argue this creates a subliminal impression of geopolitical importance that mirrors historical colonial hierarchies. Defenders note that the projection has genuine navigational utility, and that criticizing it for political distortion anachronistically applies modern concerns to a pre-modern document.\n\nThe defenders' argument is weakened most by which consideration?`,
 choices:[{e:'The Mercator projection was the first map ever created'},{e:'Modern use of Mercator projection in schools and media continues long after its navigational utility is the primary concern'},{e:'Mercator himself had no political intentions'},{e:'All maps have some form of distortion'},{e:'The projection is less accurate than GPS'}],
 answer:1,
 exp:`Defenders argue the Mercator projection serves navigational utility and criticizing it is anachronistic. But if modern schools and media continue using it without navigational need, the "utility" defense collapses — the political critique then applies to current, not historical, use. Answer B directly undermines this defense.`,},

{id:88,type:'Reading Comprehension',difficulty:2,
 q:`[Passage] The term "cultural appropriation" has become contested in public discourse. Critics use it to describe situations where members of a dominant cultural group adopt elements of minority cultures without proper attribution, understanding, or compensation—often for profit. Defenders of cross-cultural exchange argue that all cultures borrow from each other, that prohibiting such exchange is itself a form of cultural essentialism, and that exchange, when done respectfully, promotes understanding. Both sides often talk past each other because they are addressing different phenomena under the same label.\n\nThe author's assessment of the debate is best described as:`,
 choices:[{e:'Strongly in favor of critics of cultural appropriation'},{e:'Strongly in favor of defenders of cultural exchange'},{e:'Diagnostically neutral — identifying a conceptual source of confusion rather than taking sides'},{e:'Dismissive of both sides as intellectually unserious'},{e:'Urging greater government regulation of cultural products'}],
 answer:2,
 exp:`The passage summarizes both positions fairly and concludes "both sides often talk past each other because they are addressing different phenomena under the same label." This is a diagnostic observation — identifying conceptual confusion — not taking sides. Answer C.`,},

{id:89,type:'Reading Comprehension',difficulty:3,
 q:`[Passage] In classical mechanics, the trajectory of a particle is fully determined by its initial position and momentum — give a perfect calculator the state of the universe at any moment, and it could predict all future states. Quantum mechanics undermined this determinism: at the subatomic level, only probabilities can be predicted, not definite outcomes. Einstein famously resisted this interpretation ("God does not play dice"), preferring to believe that quantum indeterminacy reflects our ignorance of hidden variables rather than genuine ontological randomness. Bell's theorem, and subsequent experiments, have largely ruled out local hidden variable theories, supporting the view that quantum indeterminacy is irreducible.\n\nEinstein's position, as described, is best characterized as:`,
 choices:[{e:'Epistemic humility about the limits of science'},{e:'A commitment to ontological determinism defended through epistemic reinterpretation of quantum indeterminacy'},{e:'Rejection of quantum mechanics as a valid scientific theory'},{e:'Pragmatic acceptance of quantum indeterminacy'},{e:'A religious objection to scientific materialism'}],
 answer:1,
 exp:`Einstein accepted quantum math but reinterpreted indeterminacy epistemically (we don't know hidden variables) to preserve ontological determinism (reality is still determined). He kept determinism by claiming indeterminacy is epistemic (our ignorance), not ontological (actual randomness). Answer B captures this precisely.`,},

{id:90,type:'Reading Comprehension',difficulty:2,
 q:`[Passage] Women's participation in the paid labor force increased dramatically throughout the twentieth century in most industrialized nations. Multiple factors contributed: feminist movements challenging traditional gender roles, economic necessity during wartime, expansion of service-sector jobs deemed compatible with female employment, and improved access to education. Despite this progress, persistent gaps in pay and leadership representation remain. Sociologists debate whether these gaps primarily reflect discrimination, the undervaluing of female-dominated professions, different career choices influenced by still-unequal domestic responsibilities, or some combination of all three.\n\nThe passage suggests that persistent wage gaps are best understood as:`,
 choices:[{e:'Entirely the result of intentional discrimination'},{e:'A multifactorial phenomenon without a single definitive explanation'},{e:'The result of women choosing lower-paying careers'},{e:'Primarily caused by undervaluation of female-dominated professions'},{e:'A problem that has been largely solved'}],
 answer:1,
 exp:`The passage says sociologists debate three possible causes: discrimination, undervaluing female professions, different career choices — or "some combination of all three." This indicates multifactorial, not single-cause. Answer B. A, C, and D each offer one cause as primary — contradicted by the passage.`,},

// ── ANALOGIES (Q91-100) ─────────────────────────────
{id:91,type:'Analogies',difficulty:2,
 q:`ENERVATE : VITALITY :: ADULTERATE : ___`,
 choices:[{e:'purity'},{e:'contamination'},{e:'corruption'},{e:'mixture'},{e:'substance'}],
 answer:0,
 exp:`"Enervate" means to drain vitality (vigor). "Adulterate" means to impure purity (by adding inferior substances). The relationship: verb → the thing it destroys/reduces. Enervate:vitality = adulterate:purity.`,},

{id:92,type:'Analogies',difficulty:2,
 q:`CHARLATAN : AUTHENTICITY :: SYCOPHANT : ___`,
 choices:[{e:'sincerity'},{e:'flattery'},{e:'praise'},{e:'loyalty'},{e:'obedience'}],
 answer:0,
 exp:`A charlatan lacks authenticity — it's what defines their negative character. A sycophant lacks sincerity — their flattery is hollow and self-serving, not genuine. The relationship is: person → the virtue they fundamentally lack.`,},

{id:93,type:'Analogies',difficulty:3,
 q:`PROLIX : WORDS :: SPENDTHRIFT : ___`,
 choices:[{e:'money'},{e:'time'},{e:'energy'},{e:'resources'},{e:'talent'}],
 answer:0,
 exp:`"Prolix" means using too many words — excessive with words. "Spendthrift" means spending excessively — excessive with money. The relationship: adjective → what is used in excess.`,},

// ─── STATE ───────────────────────────────────────────
let filteredQ = [...ALL_QUESTIONS];
let currentIndex = 0;
let userAnswers = {}; // {questionId: answerIndex | null}
let correctCount = 0, wrongCount = 0;
let currentCat = 'all';

// ─── INIT ─────────────────────────────────────────────
function init() {
  filteredQ = currentCat === 'all' ? [...ALL_QUESTIONS] : ALL_QUESTIONS.filter(q => q.type === currentCat);
  renderNavDots();
  renderQuestion();
}

function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentIndex = 0;
  init();
}

// ─── NAV DOTS ─────────────────────────────────────────
function renderNavDots() {
  const nav = document.getElementById('qCounterNav');
  nav.innerHTML = '';
  filteredQ.forEach((q, i) => {
    const d = document.createElement('button');
    d.className = 'q-nav-dot';
    d.textContent = i + 1;
    if (i === currentIndex) d.classList.add('current');
    const ans = userAnswers[q.id];
    if (ans !== undefined) {
      if (ans === q.answer) d.classList.add('qd-correct');
      else d.classList.add('qd-wrong');
    }
    d.onclick = () => goTo(i);
    nav.appendChild(d);
  });
}

// ─── RENDER QUESTION ─────────────────────────────────
function renderQuestion() {
  const q = filteredQ[currentIndex];
  if (!q) return;

  // stats
  document.getElementById('statQ').textContent = currentIndex + 1;
  const attempted = Object.keys(userAnswers).length;
  const acc = attempted > 0 ? Math.round((correctCount / attempted) * 100) : '—';
  document.getElementById('statC').textContent = correctCount;
  document.getElementById('statW').textContent = wrongCount;
  document.getElementById('statAcc').textContent = attempted > 0 ? acc + '%' : '—';
  document.getElementById('progressBar').style.width = ((currentIndex + 1) / filteredQ.length * 100) + '%';

  // build card
  const diffDots = [1,2,3].map(n => `<span class="diff-dot${n<=q.difficulty?' filled':''}"></span>`).join('');
  const typeBadge = {
    'Vocabulary':'badge-vocab','Sentence Equivalence':'badge-sentence',
    'Text Completion':'badge-reading','Reading Comprehension':'badge-reading',
    'Analogies':'badge-analogy'
  }[q.type] || 'badge-vocab';

  const answered = userAnswers[q.id] !== undefined;
  const userAns = userAnswers[q.id];

  let choicesHTML = q.choices.map((c, i) => {
    let cls = 'choice';
    if (answered) {
      cls += ' locked';
      if (i === q.answer) cls += ' correct';
      else if (i === userAns) cls += ' wrong';
    }
    return `<button class="${cls}" onclick="selectChoice(${i})">
      <span class="choice-letter">${String.fromCharCode(65+i)}</span>
      <span class="choice-text">${c.e}</span>
    </button>`;
  }).join('');

  let resultBanner = '';
  if (answered) {
    const isCorrect = userAns === q.answer;
    resultBanner = `<div class="result-banner ${isCorrect?'correct-banner':'wrong-banner'}">
      ${isCorrect ? '✓Correct!' : `✗ پاسخ اشتباه — جواب درست: ${String.fromCharCode(65+q.answer)}`}
    </div>`;
  }

  let expHTML = answered ? `<div class="explanation">
    <div class="explanation-header"><span class="explanation-icon">💡</span><span class="explanation-title">Explanation</span></div>
    <div class="explanation-text">${q.exp}</div>
  </div>` : '';

  document.getElementById('qCard').innerHTML = `
    <div class="q-meta">
      <span class="q-num">Question ${currentIndex+1} ${filteredQ.length}</span>
      <span class="q-type-badge ${typeBadge}">${q.type}</span>
      <span class="q-difficulty">${diffDots}</span>
    </div>
    <div class="q-text">${q.q.replace(/\n/g,'<br>')}</div>
    <div class="choices">${choicesHTML}</div>
    ${resultBanner}
    ${expHTML}
  `;

  // buttons
  document.getElementById('btnPrev').disabled = currentIndex === 0;
  document.getElementById('btnNext').disabled = currentIndex >= filteredQ.length - 1;
  document.getElementById('btnSubmit').style.display = answered ? 'none' : 'flex';

  renderNavDots();
}

let selectedChoice = null;

function selectChoice(i) {
  const q = filteredQ[currentIndex];
  if (userAnswers[q.id] !== undefined) return;
  selectedChoice = i;
  document.querySelectorAll('.choice').forEach((el, idx) => {
    el.classList.toggle('selected', idx === i);
  });
}

function submitAnswer() {
  if (selectedChoice === null) { alert('Please select an answer first'); return; }
  const q = filteredQ[currentIndex];
  userAnswers[q.id] = selectedChoice;
  if (selectedChoice === q.answer) correctCount++;
  else wrongCount++;
  selectedChoice = null;
  renderQuestion();
}

function goTo(i) {
  if (i < 0 || i >= filteredQ.length) return;
  selectedChoice = null;
  currentIndex = i;
  renderQuestion();
}

// ─── SUMMARY ─────────────────────────────────────────
function showSummary() {
  document.getElementById('quizView').style.display = 'none';
  document.getElementById('wordlist').style.display = 'none';
  document.getElementById('summary').style.display = 'block';

  const attempted = Object.keys(userAnswers).length;
  const pct = attempted > 0 ? Math.round(correctCount/attempted*100) : 0;
  const icon = pct >= 80 ? '🏆' : pct >= 60 ? '🎓' : pct >= 40 ? '📚' : '🔄';

  document.getElementById('summaryIcon').textContent = icon;
  document.getElementById('summaryScore').textContent = pct + '%';
  document.getElementById('summaryDenom').textContent = `${attempted} questions answered`;
  document.getElementById('sumCorrect').textContent = correctCount;
  document.getElementById('sumWrong').textContent = wrongCount;
  document.getElementById('sumSkip').textContent = ALL_QUESTIONS.length - attempted;

  // breakdown by category
  const cats = ['Vocabulary','Sentence Equivalence','Text Completion','Reading Comprehension','Analogies'];
  const catNames = {
    'Vocabulary':'Vocabulary','Sentence Equivalence':'Sentence Equivalence',
    'Text Completion':'Text Completion','Reading Comprehension':'Reading Comprehension','Analogies':'Analogies'
  };
  let rows = '';
  cats.forEach(cat => {
    const qs = ALL_QUESTIONS.filter(q => q.type === cat);
    const ans = qs.filter(q => userAnswers[q.id] !== undefined);
    const cor = qs.filter(q => userAnswers[q.id] === q.answer);
    rows += `<div class="breakdown-row">
      <span>${catNames[cat]}</span>
      <span>${cor.length}/${ans.length} Correct</span>
    </div>`;
  });
  document.getElementById('breakdownRows').innerHTML = rows;
}

function showQuiz() {
  document.getElementById('quizView').style.display = 'block';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('wordlist').style.display = 'none';
  renderQuestion();
}

function resetAll() {
  userAnswers = {}; correctCount = 0; wrongCount = 0; currentIndex = 0; selectedChoice = null;
  showQuiz();
}

function showWordlist() {
  document.getElementById('quizView').style.display = 'none';
  document.getElementById('summary').style.display = 'none';
  document.getElementById('wordlist').style.display = 'block';

  const grid = document.getElementById('wordGrid');
  grid.innerHTML = VOCAB_GLOSSARY.map(w => {
    const q = ALL_QUESTIONS.find(q =>
      q.choices.some(c => c.e.toLowerCase().includes(w.e.toLowerCase())) ||
      q.q.toLowerCase().includes(w.e.toLowerCase())
    );
    let statusCls = 'ws-unattempted', statusTitle = 'Unanswered';
    if (q && userAnswers[q.id] !== undefined) {
      const correct = userAnswers[q.id] === q.answer;
      statusCls = correct ? 'ws-correct' : 'ws-wrong';
      statusTitle = correct ? 'Correct' : 'Wrong';
    }
    return `<div class="word-chip">
      <div>
        <div class="word-en">${w.e}</div>
      </div>
      <div class="word-status ${statusCls}" title="${statusTitle}"></div>
    </div>`;
  }).join('');
}

init();
